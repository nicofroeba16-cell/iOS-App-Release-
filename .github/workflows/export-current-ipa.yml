name: Export Current IPA
on:
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Download release IPA
        run: curl -fL 'https://github.com/nicofroeba16-cell/iOS-App-Release-/releases/download/v1.0.2/IOSNext.ipa' -o IOSNext.ipa
      - name: Verify
        run: |
          test "$(stat -c%s IOSNext.ipa)" = "3010174"
          echo '04051ebbcf188f11537c7a1ec5fa94b0d6025156d0397eb48f1c2bbba02e1833  IOSNext.ipa' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: IOSNext-ipa
          path: IOSNext.ipa
          retention-days: 1
